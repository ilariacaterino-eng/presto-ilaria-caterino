    <h1 class="text-center fs-1 mt-3">Pagina degli annunci</h1>
    <div class="container mt-5">
        <div class="row">
            <!-- accordion -->
            <div class="col-12 col-md-3">
                <h3>Filtra per:</h3>
                <div class="accordion accordion-flush sticky-top" id="accordionFlushExample">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseOne" aria-expanded="false" aria-controls="flush-collapseOne">
                                Categoria
                            </button>
                        </h2>
                        <div id="flush-collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
                            <div id="radioWrapper" class="accordion-body">

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="categories" id="all" checked>
                                    <label class="form-check-label" for="all">
                                        Tutte le categorie
                                    </label>
                                </div>
                                
                            </div>
                        </div>
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseTwo" aria-expanded="false" aria-controls="flush-collapseTwo">
                                    Prezzo
                                </button>
                            </h2>
                            <div id="flush-collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
                                <div class="accordion-body">
                                    <input type="range" class="w-100" value="500" min="0" max="" id="priceInput">
                                    <p class="lead" id="priceValue">0</p>
                                </div>
                            </div>
                        </div>
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseThree" aria-expanded="false" aria-controls="flush-collapseThree">
                                    Parola
                                </button>
                            </h2>
                            <div id="flush-collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
                                <div class="accordion-body">
                                    <input id="wordInput" type="text">
                                </div>
                            </div>
                        </div>
                    </div>                
                </div>
                <!-- accordion end -->
             
            </div>
            <!-- accordion end -->

            <!-- card -->
            <div id="cardWrapper" class="col-12 col-md-9 d-flex flex-wrap justify-content-center">
